function hydrateIcons(root=document){root.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));}
function esc(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function validLink(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}}
const cats=['未分类','AI 与效率','素材资源','影像审美','音乐音效','内容参考'];
const types={site:{label:'常用网站',icon:'globe'},inspiration:{label:'视频灵感',icon:'film'},topic:{label:'选题库',icon:'note'}};

const navigation=[{id:'all',name:'全部收藏',icon:'grid'},{id:'site',name:'常用网站',icon:'globe'},{id:'inspiration',name:'视频灵感',icon:'film'},{id:'topic',name:'选题库',icon:'note'},{id:'radar',name:'热点雷达',icon:'radar'}];
const suggestions=[
 {title:'Pexels',url:'https://www.pexels.com/',category:'素材资源',notes:'寻找日常、人物与街景的图片和视频。',color:'#e9f4ee',ink:'#4a886b',letter:'P'},
 {title:'FilmGrab',url:'https://film-grab.com/',category:'影像审美',notes:'按电影画面寻找构图、色彩和情绪参考。',color:'#f2ecf4',ink:'#916e9a',letter:'FG'},
 {title:'Runway',url:'https://runwayml.com/',category:'AI 与效率',notes:'把创意带入 AI 影像与视频实验。',color:'#e9edf5',ink:'#64798f',letter:'R'},
 {title:'Unsplash',url:'https://unsplash.com/',category:'素材资源',notes:'用摄影作品寻找人物、城市与光影灵感。',color:'#f1eee9',ink:'#a18963',letter:'U'},
 {title:'Freesound',url:'https://freesound.org/',category:'音乐音效',notes:'检索环境声、生活拟音与声音素材。',color:'#faf1e4',ink:'#b79a60',letter:'f'},
 {title:'即梦 AI',url:'https://jimeng.jianying.com/',category:'AI 与效率',notes:'尝试把脑海里的画面生成出来。',color:'#efebfc',ink:'#9781c4',letter:'即'}
];
let items=[],view='all',category='全部',query='',topicFilter='全部',loading=true,loadError='',loadRun=0,toastTimer,previousFocus=null,radarData=null,radarQuery='AI 视频创作',radarSources=['xhs','instagram','wechat'],radarBusy=false;
const main=document.getElementById('main'),modalRoot=document.getElementById('modal-root');
const assetUrl=a=>'/api/assets/'+a.key.split('/').map(encodeURIComponent).join('/');
function activeItems(){return items.filter(x=>!x.archived);}
function toast(text,error=false){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML='<div class="toast '+(error?'error':'')+'" role="status">'+esc(text)+'</div>';toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',4200);}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...(options.body&&!(options.body instanceof FormData)?{'Content-Type':'application/json'}:{}),...options.headers}});let d;try{d=await r.json();}catch{throw new Error('连接暂不可用，请刷新后重试');}if(!r.ok)throw new Error(d.error||'操作未完成，请重试');return d;}
async function load(){const run=++loadRun;loading=true;loadError='';render();try{let cursor,all=[];do{const d=await api('/api/items'+(cursor?'?cursor='+encodeURIComponent(cursor):''));all.push(...d.items);cursor=d.cursor;if(all.length>=5000&&cursor)throw new Error('素材较多，请通过聊天搜索完整资料库');}while(cursor);if(run!==loadRun)return;items=all.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));loading=false;render();}catch(e){if(run!==loadRun)return;loading=false;loadError=e.message;render();}}
function renderNav(){document.getElementById('primary-nav').innerHTML=navigation.map(n=>'<button class="nav-item '+(view===n.id?'active':'')+'" data-view="'+n.id+'" '+(view===n.id?'aria-current="page"':'')+'>'+icon(n.icon)+esc(n.name)+(types[n.id]?'<span class="count">'+activeItems().filter(i=>i.type===n.id).length+'</span>':'')+'</button>').join('');document.getElementById('secondary-nav').innerHTML=[{id:'favorites',icon:'star',name:'特别收藏'},{id:'archived',icon:'archive',name:'已收起'}].map(n=>'<button class="nav-item '+(view===n.id?'active':'')+'" data-view="'+n.id+'">'+icon(n.icon)+n.name+'</button>').join('');document.getElementById('breadcrumb-current').textContent=[...navigation,{id:'favorites',name:'特别收藏'},{id:'archived',name:'已收起'}].find(n=>n.id===view)?.name||'全部收藏';}
function setView(v){view=v;category='全部';query='';topicFilter='全部';closeMenu();render();window.scrollTo({top:0,behavior:'smooth'});}
function hero(){const h={all:['把灵感，留给下一次创作。','收藏好用的网站，收好打动你的画面，慢慢长出自己的选题。'],site:['好用的网站，随手就能找到。','把常用入口收在一起，需要时不用重新翻找。'],inspiration:['留住那个，让你停下来的画面。','收藏片段与录屏，把喜欢的原因拆开，变成自己的创作方法。'],topic:['下一次，想聊点什么？','随时记下一个念头，再把它慢慢做出来。'],radar:['看看大家，正在聊什么。','从 AI 创作、影像工具到真实使用场景，找到值得继续追问的话题。'],favorites:['留给那些，会反复用到的。','特别喜欢的入口、画面和想法，都在这里。'],archived:['先收起来，也不用丢掉。','暂时用不到的素材可以放在这里，随时重新放回素材库。']}[view];return '<section class="hero"><div><div class="eyebrow">'+icon('sparkles')+' LITTLE THINGS, BIG IDEAS</div><h1>'+h[0]+'</h1><p>'+h[1]+'</p></div><div class="hero-art" aria-hidden="true"><div class="paper back">'+icon('image')+'</div><div class="paper front">'+icon(view==='radar'?'radar':'film')+'</div><span class="little-star">'+icon('sparkles')+'</span></div></section>';}
function toolbar(){return '<div class="toolbar"><label class="search">'+icon('search')+'<input id="global-search" type="search" aria-label="搜索素材" placeholder="搜索标题、标签、备注或内容拆解" value="'+esc(query)+'"><span class="kbd">⌘ K</span></label><button class="primary" data-add="'+(types[view]?view:'inspiration')+'">'+icon('plus')+(view==='topic'?'记下选题':'收好素材')+'</button></div>';}
function sectionHead(title,name,count,more){return '<div class="section-head"><div class="section-title">'+icon(name)+'<h2>'+title+'</h2>'+(count!==undefined?'<small>'+count+'</small>':'')+'</div>'+(more?'<button class="text-button" data-view="'+more+'">查看全部</button>':'')+'</div>';}
function siteCard(item,suggested=false,index=-1){const u=validLink(item.url),host=u?new URL(u).hostname.replace(/^www\./,''):'未添加链接';const fill=item.color||['#eeeafa','#eaf1f9','#eef3eb','#f6ede6'][item.title.length%4];const ink=item.ink||'#8b7aaf';return '<article class="site-card '+(suggested?'suggested-card':'')+'"><a class="site-top" '+(u?'href="'+esc(u)+'" target="_blank" rel="noopener noreferrer"':'data-open="'+esc(item.id)+'" href="#"')+'><span class="site-avatar" style="background:'+fill+';color:'+ink+'">'+esc(item.letter||item.title.slice(0,1).toUpperCase())+'</span><span style="min-width:0"><h3 class="site-title">'+esc(item.title)+'</h3><span class="site-host">'+esc(host)+'</span></span></a><div class="card-actions">'+(suggested?(activeItems().some(x=>x.type==='site'&&x.url===item.url)?'<span class="icon-button saved-note" title="已收藏">'+icon('check')+'</span>':'<button class="icon-button" data-suggest="'+index+'" aria-label="收藏 '+esc(item.title)+'" title="加入我的素材库">'+icon('plus')+'</button>'):'<button class="icon-button '+(item.favorite?'starred':'')+'" data-star="'+esc(item.id)+'" aria-label="'+(item.favorite?'取消特别收藏':'特别收藏')+'">'+icon('star')+'</button><button class="icon-button" data-open="'+esc(item.id)+'" aria-label="编辑 '+esc(item.title)+'">'+icon('more')+'</button>')+'</div><p class="site-description">'+esc(item.notes||'添加一句备注，记录它好用在哪里。')+'</p><div class="card-bottom"><span class="tag">'+esc(item.category)+'</span>'+(item.tags||[]).slice(0,1).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></article>';}
function inspirationCard(item){const image=item.attachments?.find(a=>a.type.startsWith('image/'));const hasVideo=item.attachments?.some(a=>a.type.startsWith('video/'));const analyzed=Object.values(item.analysis||{}).some(Boolean);return '<article class="inspo-card" data-open="'+esc(item.id)+'" tabindex="0" role="button" aria-label="打开 '+esc(item.title)+'"><div class="inspo-cover">'+(image?'<img loading="lazy" src="'+esc(assetUrl(image))+'" alt="'+esc(item.title)+'">':icon(hasVideo?'play':'film'))+'<span class="source-label">'+esc(item.source||'我的灵感')+'</span></div><div class="inspo-body"><h3>'+esc(item.title)+'</h3><p>'+esc(item.notes||'打开素材，记下你喜欢的原因。')+'</p><div class="inspo-foot"><span>'+esc(item.category)+' · '+date(item.createdAt)+'</span><span class="analysis-pill '+(analyzed?'done':'')+'">'+(analyzed?'已拆解':'待拆解')+'</span></div></div></article>';}
function topicRow(item){return '<article class="topic-row" data-open="'+esc(item.id)+'" role="button" tabindex="0"><div class="topic-mark">'+icon('note')+'</div><div class="topic-info"><h3>'+esc(item.title)+'</h3><p>'+esc(item.notes||(item.tags||[]).join(' · ')||'还可以补充一个切入角度')+'</p></div><span class="topic-date">'+date(item.updatedAt)+'</span><span class="status '+esc(item.status)+'">'+statuses[item.status]+'</span></article>';}
function date(d){return new Date(d).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',timeZone:'Asia/Shanghai'});}
function empty(type,compact=false){const data={site:['globe','先收好一个常用网站','以后需要时，就来这里找。','收藏网站'],inspiration:['film','放下一段值得再看的画面','录屏、片段、图片，都可以收好。','收藏灵感'],topic:['bulb','一个念头，就是一个开始','不用想完整，先记下来。','记下选题'],favorites:['star','还没有特别收藏','点一下网站卡片或编辑页里的星标。',''],archived:['archive','这里暂时是空的','收起的素材可以随时恢复。',''],search:['search','还没有找到这条素材','试试其他关键词，或清空筛选。','']}[type];return '<div class="empty '+(compact?'mini-empty':'')+'"><span class="empty-icon">'+icon(data[0])+'</span><div><h3>'+data[1]+'</h3><p>'+data[2]+'</p></div>'+(data[3]?'<button class="'+(compact?'icon-button':'secondary')+'" data-add="'+type+'" aria-label="'+data[3]+'">'+icon('plus')+(compact?'':data[3])+'</button>':'')+'</div>';}
function render(){renderNav();main.innerHTML=hero()+(view==='radar'?renderRadar():toolbar()+(loadError?'<div class="status-bar" role="alert"><span>读取未完成：'+esc(loadError)+'</span><button class="text-button" data-reload>重试</button></div>':'')+'<div id="library-content">'+(loading?'<div class="loading" role="status">正在整理你的素材架…</div>':renderLibrary())+'</div>')+'<footer class="footer"><span>一点点收集，慢慢成为自己的创作养分。</span><span>MADE ROOM FOR IDEAS</span></footer>';const input=document.getElementById('global-search');if(input)input.addEventListener('input',e=>{query=e.target.value;if(!loading)document.getElementById('library-content').innerHTML=renderLibrary();});if(view==='radar')wireRadar();}
function filtered(){let list=items.filter(i=>view==='archived'?i.archived:!i.archived);if(types[view])list=list.filter(i=>i.type===view);if(view==='favorites')list=list.filter(i=>i.favorite);if(category!=='全部')list=list.filter(i=>i.category===category);if(topicFilter!=='全部')list=list.filter(i=>i.status===topicFilter);const q=query.toLowerCase().trim();if(q)list=list.filter(i=>[i.title,i.notes,i.url,i.source,i.category,...(i.tags||[]),...Object.values(i.analysis||{})].join(' ').toLowerCase().includes(q));return list;}

function openEditor(type='inspiration',item=null,prefill={}){formDirty=false;editingBusy=false;currentItem=item;files=[...(item?.attachments||[])];newFiles=[];const data=item||{type,title:'',url:'',notes:'',category:'未分类',source:'',tags:[],status:'idea',analysis:{},...prefill};const analyzed=Object.values(data.analysis||{}).some(Boolean);openOverlay('<header class="drawer-head"><h2 id="drawer-title">'+(item?'编辑收藏':type==='topic'?'记下一个选题':'收好一条素材')+'</h2><button class="icon-button" data-close aria-label="关闭">'+icon('close')+'</button></header><div class="drawer-body"><div class="error-inline" id="form-error" role="alert"></div><form id="item-form"><div class="type-switch">'+Object.entries(types).map(([k,v])=>'<button type="button" class="type-option '+(data.type===k?'active':'')+'" data-form-type="'+k+'">'+icon(v.icon)+v.label+'</button>').join('')+'</div><input name="type" type="hidden" value="'+data.type+'">'+textField('给它起个名字 <span style="color:#a69cbb">*</span>','title',data.title,'一句话记录它是什么')+textField('原始链接','url',data.url,'https://… 没有链接也可以先记下来')+'<div class="fields-row"><label class="field"><span>分类</span><select name="category">'+[...new Set([...cats,data.category])].filter(Boolean).map(c=>'<option '+(c===data.category?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label>'+textField('来源','source',data.source,'小红书 / Instagram / 我的想法')+'</div>'+textField('标签','tags',(data.tags||[]).join('，'),'用逗号分隔，例如：AI 影像，人物采访')+'<label class="field" id="status-field" style="'+(data.type!=='topic'?'display:none':'')+'"><span>创作进度</span><select name="status">'+Object.entries(statuses).map(([k,v])=>'<option value="'+k+'" '+(data.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label>'+textField('我的备注','notes',data.notes,'为什么想留下它？准备在哪次创作里用到？',true)+'<div class="field"><span>图片、录屏与附件</span><button type="button" class="upload-zone" id="upload-trigger">'+icon('upload')+'<span><strong>点一下上传，或把文件拖到这里</strong><small>单个文件 100 MB 以内 · 最多 10 个附件</small></span></button><input id="file-input" class="sr-only" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,image/avif,video/mp4,video/quicktime,video/webm,audio/mpeg,audio/wav,audio/mp4,application/pdf,text/plain,.mov,.m4v"><div id="file-list"></div></div><details class="analysis" '+(analyzed?'open':'')+'><summary>'+icon('sparkles')+'内容元素拆解<span class="analysis-status">'+(analyzed?'已填写':'待分析')+'</span>'+icon('chevron','chevron')+'</summary><div class="analysis-content"><p class="analysis-explanation">把“喜欢”拆成可以学习的方法。已有原文或视频时再填写，分析推测与实际数据分开记录。</p><div class="analysis-actions"><button class="secondary" type="button" id="copy-analysis">'+icon('copy')+'复制给 ChatGPT 的拆解要求</button></div>'+[['hook','开头钩子','前 3 秒用什么画面、问题或信息让人停下来？'],['structure','内容结构','故事怎样展开？转折、节奏和结尾怎样安排？'],['visual','画面与声音','构图、镜头、剪辑、音乐和字幕有哪些特点？'],['emotion','情绪与互动','触发了什么情绪？评论、点赞等数据有何证据？'],['reuse','可以怎么借鉴','适合迁移到我的哪个选题？怎样改成自己的表达？']].map(([k,label,ph])=>textField(label,'analysis_'+k,data.analysis?.[k]||'',ph,true)).join('')+textField('分析依据与数据来源','analysisEvidence',data.analysisEvidence||'','例如：已观看原始录屏；互动数来自原文截图，记录核验时间。',true)+'</div></details></form></div><footer class="drawer-foot">'+(item?'<button class="danger" id="archive-item">'+icon(item.archived?'refresh':'archive')+(item.archived?'放回素材库':'先收起来')+'</button><button class="icon-button '+(item.favorite?'starred':'')+'" id="editor-star" aria-label="特别收藏">'+icon('star')+'</button>':'<button class="text-button" data-close>取消</button>')+'<button class="primary" type="submit" form="item-form" id="save-item">'+icon('check')+'保存收藏</button></footer>');const form=document.getElementById('item-form');form.elements.title.required=true;form.elements.title.maxLength=160;form.elements.url.maxLength=3000;form.addEventListener('input',()=>formDirty=true);form.addEventListener('change',()=>formDirty=true);form.addEventListener('submit',saveEditor);modalRoot.querySelectorAll('[data-form-type]').forEach(b=>b.addEventListener('click',()=>{form.elements.type.value=b.dataset.formType;modalRoot.querySelectorAll('[data-form-type]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('status-field').style.display=b.dataset.formType==='topic'?'':'none';formDirty=true;}));form.elements.url.addEventListener('change',async()=>{if(item)return;try{const d=await api('/api/classify?url='+encodeURIComponent(form.elements.url.value)+'&title='+encodeURIComponent(form.elements.title.value));if(form.elements.category.value==='未分类')form.elements.category.value=d.category;if(!form.elements.source.value)form.elements.source.value=d.source;}catch{}});document.getElementById('upload-trigger').addEventListener('click',()=>document.getElementById('file-input').click());document.getElementById('file-input').addEventListener('change',e=>addFiles(e.target.files));const zone=document.getElementById('upload-trigger');zone.addEventListener('dragover',e=>{e.preventDefault();zone.style.background='#efebfc';});zone.addEventListener('dragleave',()=>zone.style.background='');zone.addEventListener('drop',e=>{e.preventDefault();zone.style.background='';addFiles(e.dataTransfer.files);});document.getElementById('copy-analysis').addEventListener('click',()=>copyAnalysis(form));if(item){document.getElementById('archive-item').addEventListener('click',archiveCurrent);document.getElementById('editor-star').addEventListener('click',e=>{const b=e.currentTarget;b.classList.toggle('starred');formDirty=true;});}renderFiles();setTimeout(()=>form.elements.title.focus(),50);}
function addFiles(list){for(const file of list){if(files.length+newFiles.length>=10){toast('每条素材最多 10 个附件',true);break;}if(file.size>100*1024*1024||file.size===0){toast('单个附件需大于 0 且不超过 100 MB',true);continue;}newFiles.push(file);}formDirty=true;renderFiles();}
function renderFiles(){const target=document.getElementById('file-list');if(!target)return;target.innerHTML=files.map((a,i)=>'<div class="file">'+icon(a.type.startsWith('video')?'film':'image')+'<a href="'+esc(assetUrl(a))+'" target="_blank" rel="noopener noreferrer">'+esc(a.name)+'</a><button class="icon-button" type="button" data-remove-file="'+i+'" aria-label="移除附件">'+icon('close')+'</button></div>'+((a.type.startsWith('image/'))?'<img class="file-preview" src="'+esc(assetUrl(a))+'" alt="'+esc(a.name)+'">':a.type.startsWith('video/')?'<video class="file-preview" controls preload="metadata" src="'+esc(assetUrl(a))+'"></video>':a.type.startsWith('audio/')?'<audio class="file-preview" controls preload="metadata" src="'+esc(assetUrl(a))+'"></audio>':'')).join('')+newFiles.map((a,i)=>'<div class="file">'+icon('upload')+'<span>'+esc(a.name)+' <small style="color:#a49aaf">· 待保存 '+(a.size/1024/1024).toFixed(1)+'MB</small></span><button class="icon-button" type="button" data-remove-new="'+i+'" aria-label="移除待上传附件">'+icon('close')+'</button></div>').join('');target.querySelectorAll('[data-remove-file]').forEach(b=>b.addEventListener('click',()=>{files.splice(Number(b.dataset.removeFile),1);formDirty=true;renderFiles();}));target.querySelectorAll('[data-remove-new]').forEach(b=>b.addEventListener('click',()=>{newFiles.splice(Number(b.dataset.removeNew),1);formDirty=true;renderFiles();}));}
async function saveEditor(e){e.preventDefault();if(editingBusy)return;const form=document.getElementById('item-form');if(!form.reportValidity())return;editingBusy=true;const button=document.getElementById('save-item'),error=document.getElementById('form-error');button.disabled=true;error.style.display='none';try{while(newFiles.length){button.innerHTML='<span class="spinner"></span>正在上传附件…';const f=new FormData();f.set('file',newFiles[0]);const uploaded=await api('/api/upload',{method:'POST',body:f});files.push(uploaded);newFiles.shift();renderFiles();}button.innerHTML='<span class="spinner"></span>正在保存…';const data=Object.fromEntries(new FormData(form));data.tags=data.tags.split(/[,，、\n]/).map(x=>x.trim()).filter(Boolean);data.attachments=files;data.analysis={};for(const k of ['hook','structure','visual','emotion','reuse'])data.analysis[k]=data['analysis_'+k];data.favorite=!!document.getElementById('editor-star')?.classList.contains('starred');if(currentItem)data.expectedUpdatedAt=currentItem.updatedAt;const result=await api('/api/items'+(currentItem?'/'+currentItem.id:''),{method:currentItem?'PATCH':'POST',body:JSON.stringify(data)});mergeItem(result.item);editingBusy=false;closeDrawer();render();toast(result.duplicate?'这条链接已经收好，已为你打开原有收藏':'已经好好收起来了');if(result.duplicate)openEditor(result.item.type,result.item);}catch(e){error.textContent=e.message;error.style.display='block';error.scrollIntoView({block:'nearest'});button.disabled=false;button.innerHTML=icon('check')+'保存收藏';editingBusy=false;}}
function mergeItem(item){items=[item,...items.filter(x=>x.id!==item.id)].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));}
async function star(id){const item=items.find(i=>i.id===id);if(!item)return;try{const d=await api('/api/items/'+id,{method:'PATCH',body:JSON.stringify({favorite:!item.favorite,expectedUpdatedAt:item.updatedAt})});mergeItem(d.item);render();toast(d.item.favorite?'已加入特别收藏':'已取消特别收藏');}catch(e){toast(e.message,true);}}
async function archiveCurrent(){if(editingBusy)return;if(formDirty&&!confirm('当前有未保存修改，继续收起或恢复这条素材吗？'))return;editingBusy=true;try{const d=await api('/api/items/'+currentItem.id,{method:'PATCH',body:JSON.stringify({archived:!currentItem.archived,expectedUpdatedAt:currentItem.updatedAt})});mergeItem(d.item);editingBusy=false;closeDrawer();render();toast(d.item.archived?'已收起，可以随时恢复':'已放回素材库');}catch(e){editingBusy=false;toast(e.message,true);}}
async function clipboard(text){try{await navigator.clipboard.writeText(text);}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw new Error('复制未成功，请手动选择内容');}}
async function copyAnalysis(form){const title=form.elements.title.value,url=form.elements.url.value;const text='请帮我把这条素材归档到「囤囤屋」，并基于实际内容完成拆解。\n标题：'+title+'\n链接：'+url+(currentItem?'\n素材 ID：'+currentItem.id:'')+'\n我的备注：'+form.elements.notes.value+'\n请先读取原文或观看我提供的图片/录屏。如果无法访问，直接告诉我缺少什么，不要根据标题编造内容。\n依次拆解：1.开头钩子（前3秒） 2.内容结构与节奏 3.画面、声音与字幕 4.情绪与互动机制 5.适合我的 AI 创作方向的借鉴与改写。\n保留原始来源；推测请标注。没有真实互动数据就不能断言是爆款。连接囤囤屋后请先搜索原记录，再更新相应分析字段。';try{await clipboard(text);toast('已复制，带上原文或录屏发给 ChatGPT 即可');}catch(e){toast(e.message,true);}}
async function addSuggested(index){const s=suggestions[index];if(!s)return;try{const d=await api('/api/items',{method:'POST',body:JSON.stringify({type:'site',title:s.title,url:s.url,category:s.category,notes:s.notes,tags:[],source:'起始书签'})});mergeItem(d.item);render();toast(d.duplicate?'这个网站已经在素材库里了':'已收进常用网站');}catch(e){toast(e.message,true);}}
function manage(){formDirty=false;openOverlay('<header class="drawer-head"><h2 id="drawer-title">数据与使用说明</h2><button class="icon-button" data-close aria-label="关闭">'+icon('close')+'</button></header><div class="drawer-body"><div class="help-panel"><p><strong>你的个人创作空间</strong><br>素材和附件随账号保存。记录可以编辑、特别收藏或收起；前台保持简单，详细信息在素材里展开。</p></div><div class="help-list"><div><h3>随手发给我，也能慢慢整理</h3><p>在 ChatGPT 中连接「囤囤屋」后，发来链接、图片或想法，说明“收进囤囤屋”。我会保存来源、整理分类，再根据实际内容拆解。聊天中的文件需要通过可用的附件入口保存；大录屏可从网站直接上传。</p></div><div><h3>视频拆解的五个维度</h3><p>开头钩子、内容结构、画面与声音、情绪与互动、可以怎么借鉴。没有看到原文或素材时，先保留为待分析，不虚构内容与互动数据。</p></div><div><h3>选题由你决定</h3><p>选题库支持随手添加和四种创作进度。热点雷达提供公开内容线索，你点击“存为选题”后才会加入；不会自动改动你的手动选题。</p></div><div><h3>热点搜寻的范围</h3><p>公开网页检索可能遗漏登录后内容，不能代表平台实时热榜。站内搜索会在新窗口打开，可能需要登录。搜不到不意味着没有相关内容。</p></div><div><h3>备份与恢复</h3><p>JSON 备份含完整备注、拆解与附件索引；二进制附件需单独下载保留。导入会逐条新增，已有同类型链接会跳过，原有记录不会被覆盖。单次导入最多 500 条。</p></div></div><div class="import-row"><button class="secondary" id="export-data">'+icon('download')+'导出 JSON 备份</button><label class="secondary import-label">'+icon('upload')+'导入备份<input type="file" accept=".json,application/json" id="import-data"></label></div><p class="section-note">图片与录屏：单个文件 100MB 以内，每条素材最多 10 个附件。聊天附件入口支持 8MB 以内的小文件。</p><p class="section-note">起始书签是可选入口，使用具体素材前请核对原站授权。</p></div><footer class="drawer-foot"><button class="primary" data-close>知道了</button></footer>');document.getElementById('export-data').addEventListener('click',exportData);document.getElementById('import-data').addEventListener('change',importData);}
async function exportData(){if(loadError||loading)return toast('请先完成素材读取，再导出完整备份',true);const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='tuntun-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('备份已导出，附件原文件请单独保存');}
async function importData(e){const file=e.target.files[0];if(!file)return;if(file.size>20*1024*1024)return toast('备份文件请小于 20MB',true);let data;try{data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.items)||data.items.length>500)throw new Error();}catch{return toast('请选择有效的囤囤屋 JSON 备份（最多 500 条）',true);}if(!confirm('准备导入 '+data.items.length+' 条记录。已有同类型链接会跳过，是否继续？'))return;editingBusy=true;let added=0,skipped=0,failed=0;for(const item of data.items){try{const d=await api('/api/items',{method:'POST',body:JSON.stringify(item)});d.duplicate?skipped++:added++;mergeItem(d.item);}catch{failed++;}}editingBusy=false;closeDrawer();render();toast('导入完成：新增 '+added+' 条，跳过 '+skipped+' 条'+(failed?'，失败 '+failed+' 条':''),failed>0);}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.querySelector('.sidebar-backdrop')?.remove();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view],[data-add],[data-open],[data-star],[data-close],[data-suggest],[data-category],[data-status-filter],[data-save-radar],[data-reload]');if(!b)return;if(b.hasAttribute('data-view'))setView(b.dataset.view);else if(b.hasAttribute('data-add'))openEditor(b.dataset.add);else if(b.hasAttribute('data-open')){e.preventDefault();const item=items.find(i=>i.id===b.dataset.open);if(item)openEditor(item.type,item);}else if(b.hasAttribute('data-star'))star(b.dataset.star);else if(b.hasAttribute('data-close'))requestClose();else if(b.hasAttribute('data-suggest'))addSuggested(Number(b.dataset.suggest));else if(b.hasAttribute('data-category')){category=b.dataset.category;render();}else if(b.hasAttribute('data-status-filter')){topicFilter=b.dataset.statusFilter;render();}else if(b.hasAttribute('data-save-radar')){const [s,index]=b.dataset.saveRadar.split(':');const result=radarData?.sources.find(x=>x.source===s)?.results[Number(index)];if(result)openEditor('topic',null,{type:'topic',title:result.title,url:result.url,source:result.source,notes:result.summary+'\n\n线索检索于 '+new Date(radarData.searchedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})+'。热度与原文发布时间待核验。',category:'AI 与效率',tags:['AI','待核验']});}else if(b.hasAttribute('data-reload'))load();});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('global-search')?.focus();}if(e.key==='Escape'){if(modalRoot.children.length)requestClose();else closeMenu();}if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[role="button"]')){e.preventDefault();e.target.click();}if(e.key==='Tab'&&modalRoot.children.length){const focusables=[...modalRoot.querySelectorAll('a[href],button,input,select,textarea,summary,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
document.getElementById('manage-button').addEventListener('click',manage);document.getElementById('menu-button').addEventListener('click',()=>{const sidebar=document.getElementById('sidebar');if(sidebar.classList.contains('open'))return closeMenu();sidebar.classList.add('open');const backdrop=document.createElement('div');backdrop.className='sidebar-backdrop';backdrop.addEventListener('click',closeMenu);document.body.append(backdrop);});
hydrateIcons();load();
</script>
